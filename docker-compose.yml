services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novabank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    profiles: ["mongo"]

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning
    profiles: ["obs"]

  ml-fraud:
    build: ./ml-fraud
    ports: ["8090:8090"]
    environment:
      PORT: 8090

  identity-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/identity-service
        JAR: identity-service-1.0.0.jar
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/customer-service
        JAR: customer-service-1.0.0.jar
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-novabank-internal-dev-token}
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/account-service
        JAR: account-service-1.0.0.jar
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-novabank-internal-dev-token}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/transaction-service
        JAR: transaction-service-1.0.0.jar
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-novabank-internal-dev-token}
      ACCOUNT_SERVICE_URL: http://account-service:8083
      LEDGER_SERVICE_URL: http://ledger-service:8085
      FRAUD_SERVICE_URL: http://fraud-service:8086
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
    ports: ["8084:8084"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/ledger-service
        JAR: ledger-service-1.0.0.jar
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-novabank-internal-dev-token}
    ports: ["8085:8085"]
    depends_on:
      postgres:
        condition: service_healthy

  fraud-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/fraud-service
        JAR: fraud-service-1.0.0.jar
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/fraud_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-novabank-internal-dev-token}
      ML_FRAUD_URL: http://ml-fraud:8090
      KAFKA_BROKERS: kafka:9092
    ports: ["8086:8086"]
    depends_on: [postgres, ml-fraud]

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/notification-service
        JAR: notification-service-1.0.0.jar
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: novabank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-novabank}
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      KAFKA_BROKERS: kafka:9092
    ports: ["8087:8087"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: services/api-gateway
        JAR: api-gateway-1.0.0.jar
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-novabank-dev-jwt-secret-key-must-be-32b}
      REDIS_HOST: redis
      IDENTITY_URL: http://identity-service:8081
      CUSTOMER_URL: http://customer-service:8082
      ACCOUNT_URL: http://account-service:8083
      TXN_URL: http://transaction-service:8084
      LEDGER_URL: http://ledger-service:8085
      FRAUD_URL: http://fraud-service:8086
      NOTIFY_URL: http://notification-service:8087
    ports: ["${API_GATEWAY_HOST_PORT:-8080}:8080"]
    depends_on: [identity-service, redis]

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api-gateway]

volumes:
  pgdata:
