global:
  scrape_interval: 15s
scrape_configs:
  - job_name: novabank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8081
          - customer-service:8082
          - account-service:8083
          - transaction-service:8084
          - ledger-service:8085
          - fraud-service:8086
          - notification-service:8087
          - api-gateway:8080
