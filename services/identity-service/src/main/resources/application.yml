server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:novabank}
    password: ${DB_PASSWORD:novabank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
novabank:
  jwt:
    secret: ${JWT_SECRET:novabank-dev-jwt-secret-key-must-be-32b}
    access-token-minutes: 15
    refresh-token-days: 7
logging:
  pattern:
    correlation: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
