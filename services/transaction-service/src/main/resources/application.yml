server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
    username: ${DB_USER:novabank}
    password: ${DB_PASSWORD:novabank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
novabank:
  jwt:
    secret: ${JWT_SECRET:novabank-dev-jwt-secret-key-must-be-32b}
  internal-token: ${INTERNAL_TOKEN:novabank-internal-dev-token}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
  ledger-service-url: ${LEDGER_SERVICE_URL:http://localhost:8085}
  fraud-service-url: ${FRAUD_SERVICE_URL:http://localhost:8086}
