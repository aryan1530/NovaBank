server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Idempotency-Key
            allowCredentials: false
      routes:
        - id: identity
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: customers
          uri: ${CUSTOMER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/customers/**
        - id: accounts
          uri: ${ACCOUNT_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/fixed-deposits/**,/api/v1/loans/**
        - id: txns
          uri: ${TXN_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/transfers/**,/api/v1/statements/**,/api/v1/scheduled-payments/**,/api/v1/assistant/**
        - id: ledger
          uri: ${LEDGER_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/ledger/**
        - id: fraud
          uri: ${FRAUD_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/fraud/**
        - id: notify
          uri: ${NOTIFY_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
novabank:
  jwt:
    secret: ${JWT_SECRET:novabank-dev-jwt-secret-key-must-be-32b}
