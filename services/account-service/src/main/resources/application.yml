server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account_db}
    username: ${DB_USER:novabank}
    password: ${DB_PASSWORD:novabank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
novabank:
  jwt:
    secret: ${JWT_SECRET:novabank-dev-jwt-secret-key-must-be-32b}
  internal-token: ${INTERNAL_TOKEN:novabank-internal-dev-token}
  customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
